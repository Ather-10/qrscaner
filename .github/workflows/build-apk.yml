name: Build APK & AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Camera permission
        run: sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: App icon
        run: |
          cp -r icons/* android/app/src/main/res/
          sed -i 's/#FFFFFF/#0B1020/I' android/app/src/main/res/values/ic_launcher_background.xml
      - name: Version code
        run: sed -i -E "s/versionCode[ =]+[0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build release AAB
        if: env.KS_B64 != ''
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Sign AAB
        if: env.KS_B64 != ''
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          D=android/app/build/outputs/bundle/release
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" -sigalg SHA256withRSA -digestalg SHA-256 -signedjar $D/ScanPro-signed.aab $D/app-release.aab "$KEY_ALIAS"
          ls -lh $D
      - uses: actions/upload-artifact@v4
        with:
          name: ScanPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: env.KS_B64 != ''
        with:
          name: ScanPro-AAB-for-PlayStore
          path: android/app/build/outputs/bundle/release/ScanPro-signed.aab
